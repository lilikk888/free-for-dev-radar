  #   image: free-for-dev-radar:local
  #   command: ["python", "-m", "app.cli", "collect"]
  #   environment:
  #     RADAR_DB_PATH: /data/radar.db
  #   volumes:
  #     - radar-data:/data

volumes:
  radar-data:
