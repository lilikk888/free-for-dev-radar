---
# 水平自动扩缩容（HPA）演示
#
# 前置条件：metrics-server 已安装（否则 HPA 拿不到 CPU 使用率，会一直显示 <unknown>）
#   helm upgrade --install metrics-server metrics-server/metrics-server \
#     -n kube-system --set 'args={--kubelet-insecure-tls}'
#
# 应用：kubectl apply -f demos/hpa/manifests.yaml
# 观察：kubectl get hpa -n hpa-demo -w
# 清理：kubectl delete -f demos/hpa/manifests.yaml
#
# ⚠️ 为什么单独开命名空间？业务 Deployment（radar）用的是 ReadWriteOnce 的 PVC，
#    多副本会抢同一个卷，不能扩。HPA 必须配无状态负载，所以这里用独立的演示负载。

apiVersion: v1
kind: Namespace
metadata:
  name: hpa-demo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: hpa-demo
  labels:
    app: hpa-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hpa-web
  template:
    metadata:
      labels:
        app: hpa-web
    spec:
      # 演示负载很轻，允许被调度到任意节点（包括 1GB 的 Micro）
      containers:
        - name: web
          image: docker.io/library/nginx:1.29-alpine
          ports:
            - containerPort: 80
          # ⭐ HPA 按「requests 的百分比」算，所以 requests 必须写，不写就没有基线
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 300m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 2
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: hpa-demo
spec:
  selector:
    app: hpa-web
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: web
  namespace: hpa-demo
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: web
  minReplicas: 1
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          # 平均 CPU 超过 requests(100m) 的 50% 就扩容
          averageUtilization: 50
  behavior:
    scaleDown:
      # 缩容慢一点，避免抖动（默认 300s，这里保留默认即可）
      stabilizationWindowSeconds: 120
---
# 压测 Pod：持续对 web 发请求把 CPU 打上去，用来触发扩容
# ⚠️ 它会一直跑 —— 演示完记得 delete
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loadgen
  namespace: hpa-demo
spec:
  replicas: 3
  selector:
    matchLabels:
      app: loadgen
  template:
    metadata:
      labels:
        app: loadgen
    spec:
      containers:
        - name: loadgen
          image: docker.io/library/busybox:1.36
          command:
            - sh
            - -c
            - 'while true; do wget -q -O /dev/null http://web.hpa-demo.svc.cluster.local/ ; done'
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 32Mi
