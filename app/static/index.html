<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>免费资源雷达 · 找免费的云服务和大模型额度</title>
<style>
  :root{
    --bg:#f5f7fa; --card:#fff; --fg:#1f2329; --muted:#8a9099; --line:#e8eaed;
    --brand:#2563eb; --brand-soft:#eff4ff; --ok:#0a8f4d; --ok-soft:#eafaf0;
    --warn:#b45309; --warn-soft:#fff8e6; --danger:#d93838; --danger-soft:#fdeeee;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font-size:15px;line-height:1.7;
       font-family:-apple-system,"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif}
  a{color:var(--brand);text-decoration:none} a:hover{text-decoration:underline}
  .wrap{max-width:1000px;margin:0 auto;padding:28px 20px 80px}
  header h1{margin:0 0 6px;font-size:26px;letter-spacing:-.3px}
  header p{margin:0;color:var(--muted);font-size:14px}
  .searchbar{display:flex;gap:10px;margin:22px 0 10px}
  .searchbar input{flex:1;padding:14px 16px;font-size:16px;border:1.5px solid var(--line);
    border-radius:10px;background:var(--card);outline:none;font-family:inherit}
  .searchbar input:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
  .searchbar button{padding:0 24px;border:0;border-radius:10px;background:var(--brand);color:#fff;
    font-size:15px;font-weight:600;cursor:pointer;font-family:inherit}
  .searchbar button:hover{background:#1d4ed8}
  .hints{color:var(--muted);font-size:13px;margin-bottom:18px}
  .hints b{color:var(--brand);cursor:pointer;font-weight:500}
  .hints b:hover{text-decoration:underline}
  .filters{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 20px}
  .chip{padding:6px 13px;border:1px solid var(--line);border-radius:999px;background:var(--card);
    cursor:pointer;font-size:13px;color:#4a5058;user-select:none}
  .chip:hover{border-color:var(--brand);color:var(--brand)}
  .chip.on{background:var(--brand);border-color:var(--brand);color:#fff}
  .mine{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 20px;margin-bottom:6px}
  .mine h2{margin:0 0 10px;font-size:15px}
  .mine .row{display:flex;align-items:center;gap:10px;padding:7px 0;border-top:1px solid var(--line);font-size:14px}
  .mine .nm{flex:1;font-weight:500}
  .mine .dl{font-size:12.5px;padding:2px 9px;border-radius:6px;background:#f2f4f7;color:#5a6270;white-space:nowrap}
  .mine .dl.warn{background:var(--warn-soft);color:var(--warn)}
  .mine .dl.bad{background:var(--danger-soft);color:var(--danger)}
  .mine .dl.ok{background:var(--ok-soft);color:var(--ok)}
  .mine .x{cursor:pointer;color:var(--muted);font-size:12.5px}
  .mine .x:hover{color:var(--danger)}
  .mine .empty2{color:var(--muted);font-size:13.5px}
  .act{display:flex;align-items:center;gap:10px;margin-top:10px;flex-wrap:wrap}
  .btn{padding:5px 13px;border:1px solid var(--line);border-radius:8px;background:var(--card);
    cursor:pointer;font-size:13px;color:#4a5058;font-family:inherit}
  .btn:hover{border-color:var(--brand);color:var(--brand)}
  .btn.on{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
  .act input[type=date]{padding:4px 8px;border:1px solid var(--line);border-radius:8px;
    font-size:13px;font-family:inherit;color:var(--fg);background:var(--card)}
  .act .save{padding:5px 12px;border:0;border-radius:8px;background:var(--brand);color:#fff;
    cursor:pointer;font-size:13px;font-family:inherit}
  .cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;margin:16px 0 26px}
  .cat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:13px 15px;cursor:pointer}
  .cat:hover{border-color:var(--brand);box-shadow:0 2px 10px rgba(37,99,235,.08)}
  .cat .t{font-weight:600;font-size:14.5px}
  .cat .n{color:var(--muted);font-size:12.5px;margin-top:2px}
  h2.sec{font-size:17px;margin:28px 0 12px;padding-left:10px;border-left:4px solid var(--brand)}
  h2.sec small{font-weight:400;color:var(--muted);font-size:13px;margin-left:8px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin-bottom:12px}
  .card h3{margin:0 0 6px;font-size:16.5px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .card .cat-tag{font-size:12px;font-weight:500;color:var(--brand);background:var(--brand-soft);
    padding:2px 9px;border-radius:6px}
  .card .sum{margin:6px 0 10px;color:#3a4048}
  .kv{font-size:14px;margin:5px 0;color:#3a4048}
  .kv b{color:var(--fg);font-weight:600}
  .tags{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 4px}
  .tag{font-size:12.5px;padding:2px 9px;border-radius:6px;background:#f2f4f7;color:#5a6270}
  .tag.ok{background:var(--ok-soft);color:var(--ok)}
  .tag.warn{background:var(--warn-soft);color:var(--warn)}
  .tag.bad{background:var(--danger-soft);color:var(--danger)}
  .tips{font-size:13.5px;color:var(--warn);background:var(--warn-soft);border-radius:8px;padding:8px 12px;margin-top:8px}
  .go{display:inline-block;margin-top:10px;font-size:13.5px;font-weight:500}
  details{margin-top:8px}
  summary{cursor:pointer;font-size:13.5px;color:var(--muted)}
  .ffd{border-top:1px dashed var(--line);padding:9px 0;font-size:13.5px}
  .ffd .cn{color:var(--muted);font-size:12.5px}
  .empty{color:var(--muted);background:var(--card);border:1px dashed var(--line);
    border-radius:12px;padding:26px;text-align:center}
  footer{margin-top:40px;color:var(--muted);font-size:12.5px;text-align:center;line-height:2}
  .spinner{color:var(--muted);font-size:14px;padding:14px 0}
  .stat{display:inline-block;background:var(--card);border:1px solid var(--line);border-radius:8px;
    padding:4px 11px;font-size:13px;color:var(--muted);margin-right:8px}
  .stat b{color:var(--fg)}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>免费资源雷达</h1>
    <p>输入你需要的资源，帮你找到可以免费用的方案 —— 中文说明、免费额度、要不要绑卡、国内能不能用，一次看清。</p>
  </header>

  <div class="searchbar">
    <input id="q" type="search" placeholder="我想找…（例如：免费的大模型 API、图床、免费服务器）" autocomplete="off">
    <button id="go">搜索</button>
  </div>
  <div class="hints">
    试试：
    <b data-q="免费的大模型 API">免费的大模型 API</b> ·
    <b data-q="免费服务器">免费服务器</b> ·
    <b data-q="图床">图床</b> ·
    <b data-q="免费数据库">免费数据库</b> ·
    <b data-q="内网穿透">内网穿透</b> ·
    <b data-q="发邮件">发邮件</b>
  </div>

  <div class="filters" id="filters"></div>
  <div id="mine"></div>
  <div class="cats" id="cats"></div>

  <div id="out"></div>

  <footer>
    <div><span class="stat">精选条目 <b id="s-curated">–</b></span>
         <span class="stat">收录条目 <b id="s-ffd">–</b></span>
         <span class="stat">最近更新 <b id="s-when">–</b></span></div>
    <div>「精选」= 人工核实过的条目（国内平台为主，带免费额度和注意事项）；
         「收录」= 来自开源清单 free-for-dev 的英文条目（覆盖海外服务，未逐条核实）。</div>
    <div>免费政策随时会变，注册前请以官网为准 ·
         <a href="/api/stats">数据接口</a> · <a href="/changes">最近变化</a></div>
  </footer>
</div>

<script>
const $ = s => document.querySelector(s);
const state = { q: "", cat: null, tags: [], mine: {}, mineStats: {} };

const TAG_TEXT = {
  no_card: "免信用卡", need_card: "需绑卡", need_id: "需实名",
  cn_ok: "国内直连", cn_partial: "部分可用", cn_no: "需梯子",
  permanent: "长期免费", limited: "限时赠送",
};
const TAG_STYLE = {
  no_card: "ok", cn_ok: "ok", permanent: "ok",
  need_card: "warn", cn_no: "warn", limited: "warn",
};

function esc(s){ return (s||"").replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c])); }

const FILTERS = ["no_card","need_id","cn_ok","permanent"];
function renderFilters(){
  $("#filters").innerHTML = FILTERS.map(k =>
    `<span class="chip ${state.tags.includes(k)?"on":""}" data-tag="${k}">${TAG_TEXT[k]}</span>`
  ).join("");
  $("#filters").querySelectorAll(".chip").forEach(el => el.onclick = () => {
    const t = el.dataset.tag;
    state.tags = state.tags.includes(t) ? state.tags.filter(x=>x!==t) : state.tags.concat(t);
    renderFilters(); run();
  });
}

async function renderCats(){
  const r = await fetch("/api/categories" + (state.q ? "?q="+encodeURIComponent(state.q) : ""));
  const d = await r.json();
  $("#cats").innerHTML = d.categories.map(c =>
    `<div class="cat" data-cat="${c.key}" style="${state.cat===c.key?"border-color:var(--brand);background:var(--brand-soft)":""}">
       <div class="t">${esc(c.name)}</div><div class="n">${c.count} 条精选</div></div>`
  ).join("");
  $("#cats").querySelectorAll(".cat").forEach(el => el.onclick = () => {
    state.cat = state.cat === el.dataset.cat ? null : el.dataset.cat;
    renderCats(); run();
  });
}

function daysBadge(d){
  if(d === null || d === undefined) return `<span class="dl">已注册</span>`;
  if(d < 0)  return `<span class="dl bad">已过期 ${-d} 天</span>`;
  if(d <= 7) return `<span class="dl bad">还有 ${d} 天到期</span>`;
  if(d <= 14) return `<span class="dl warn">还有 ${d} 天到期</span>`;
  return `<span class="dl ok">还有 ${d} 天</span>`;
}

function actionHTML(e){
  const m = state.mine[e.id];
  return `<div class="act">
    <button class="btn ${m ? "on" : ""}" data-mark="${e.id}">${m ? "已注册 ✓" : "我注册了"}</button>
    ${m ? daysBadge(m.days_left) : ""}
    <span class="frm" data-frm="${e.id}" style="display:none">
      <input type="date" data-date="${e.id}" value="${m && m.expires_at ? esc(m.expires_at) : ""}">
      <button class="save" data-save="${e.id}">保存到期日</button>
    </span>
    ${m ? `<span class="x" data-unmark="${e.id}">取消</span>` : ""}
  </div>`;
}

function cardHTML(e){
  // 标签由后端统一换算成标准 key（no_card / cn_ok / permanent …），前端只负责翻译
  const tags = e.tags || [];
  const tagHTML = tags.map(t =>
    `<span class="tag ${TAG_STYLE[t]||""}">${esc(TAG_TEXT[t]||t)}</span>`).join("");
  return `<div class="card">
    <h3>${esc(e.name)} <span class="cat-tag">${esc(e.category_cn||"")}</span>
        ${e.expiry ? `<span class="tag">${esc(e.expiry)}</span>` : ""}</h3>
    <div class="sum">${esc(e.summary)}</div>
    ${e.quota ? `<div class="kv"><b>免费额度：</b>${esc(e.quota)}</div>` : ""}
    <div class="tags">${tagHTML}</div>
    ${e.tips ? `<div class="tips">注意：${esc(e.tips)}</div>` : ""}
    ${e.url ? `<a class="go" href="${esc(e.url)}" target="_blank" rel="noopener">打开官网 →</a>` : ""}
    ${e.id ? actionHTML(e) : ""}
  </div>`;
}

/* ── 我的清单（领用记录 + 到期倒计时）── */
async function loadMine(){
  try{
    const d = await (await fetch("/api/mine")).json();
    state.mine = {};
    (d.items||[]).forEach(it => state.mine[it.entry_id] = it);
    state.mineStats = d.stats || {};
  }catch(e){ state.mine = {}; }
}

function renderMine(){
  const el = $("#mine");
  const items = Object.values(state.mine || {});
  const st = state.mineStats || {};
  if(!items.length){
    el.innerHTML = `<div class="mine"><h2>我的清单</h2>
      <div class="empty2">还没有记录。在下面找到想用的服务，点「我注册了」，
      填上额度到期日 —— 到期前会自动发邮件提醒你（国内平台的免费额度大多有期限，别忘了用）。</div></div>`;
    return;
  }
  const sorted = items.sort((a,b) => {
    if(a.days_left === null || a.days_left === undefined) return 1;
    if(b.days_left === null || b.days_left === undefined) return -1;
    return a.days_left - b.days_left;
  });
  el.innerHTML = `<div class="mine">
    <h2>我的清单 · 已注册 ${st.registered||0} 个${st.expiring_14d ? ` · <span style="color:var(--danger)">${st.expiring_14d} 个 14 天内到期</span>` : ""}</h2>
    ${sorted.map(m => `<div class="row">
      <span class="nm">${esc(m.name || m.entry_id)}</span>
      ${daysBadge(m.days_left)}
      <span class="x" data-unmark="${esc(m.entry_id)}">移除</span>
    </div>`).join("")}
  </div>`;
}

async function markMine(id, expiresAt){
  await fetch("/api/mine/" + encodeURIComponent(id), {
    method: "PUT",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({status: "registered", expires_at: expiresAt || null}),
  });
  await loadMine(); renderMine(); run();
}

async function unmarkMine(id){
  await fetch("/api/mine/" + encodeURIComponent(id), {method: "DELETE"});
  await loadMine(); renderMine(); run();
}

function bindCardActions(){
  document.querySelectorAll("[data-mark]").forEach(el => el.onclick = () => {
    const id = el.dataset.mark;
    const frm = document.querySelector(`[data-frm="${id}"]`);
    if(state.mine[id]){ if(frm) frm.style.display = frm.style.display === "none" ? "inline" : "none"; }
    else { if(frm) frm.style.display = "inline"; }
  });
  document.querySelectorAll("[data-save]").forEach(el => el.onclick = () => {
    const id = el.dataset.save;
    const inp = document.querySelector(`[data-date="${id}"]`);
    markMine(id, inp ? inp.value : "");
  });
  document.querySelectorAll("[data-unmark]").forEach(el => el.onclick = () => unmarkMine(el.dataset.unmark));
}

function foreignHTML(list){
  if(!list.length) return "";
  return `<details><summary>展开 ${list.length} 条来自 free-for-dev 的英文条目（未人工核实）</summary>
    ${list.map(f => `<div class="ffd">
      <div><a href="${esc(f.url)}" target="_blank" rel="noopener">${esc(f.name)}</a>
        <span class="cn">· ${esc(f.category_cn||"")}</span></div>
      <div class="cn">${esc((f.summary||"").slice(0,180))}</div></div>`).join("")}
  </details>`;
}

async function run(){
  const out = $("#out");
  out.innerHTML = `<div class="spinner">查询中…</div>`;
  const p = new URLSearchParams();
  if(state.q) p.set("q", state.q);
  if(state.cat) p.set("cat", state.cat);
  if(state.tags.length) p.set("tags", state.tags.join(","));
  let d;
  try { d = await (await fetch("/api/search?"+p.toString())).json(); }
  catch(e){ out.innerHTML = `<div class="empty">查询失败，请刷新重试。</div>`; return; }

  const title = state.q ? `「${esc(state.q)}」的搜索结果` : (state.cat ? "本分类精选" : "全部精选");
  let html = `<h2 class="sec">${title}<small>精选 ${d.counts.curated} 条${
      state.q ? `，另收录 ${d.counts.foreign} 条` : ""}</small></h2>`;

  if(!d.curated.length && !d.foreign.length){
    html += `<div class="empty">没找到匹配的。<br>换个说法试试，比如「数据库」「图床」「免费 GPU」「发邮件」。</div>`;
  } else {
    if(d.curated.length) html += d.curated.map(cardHTML).join("");
    html += foreignHTML(d.foreign);
  }
  out.innerHTML = html;
  bindCardActions();
}

async function stats(){
  try{
    const d = await (await fetch("/api/stats")).json();
    $("#s-ffd").textContent = (d.current_entries ?? "–");
    if(d.last_snapshot && d.last_snapshot.fetched_at){
      $("#s-when").textContent = new Date(d.last_snapshot.fetched_at)
        .toLocaleString("zh-CN", {hour12:false, month:"2-digit", day:"2-digit", hour:"2-digit", minute:"2-digit"});
    }
    const c = await (await fetch("/api/curated")).json();
    $("#s-curated").textContent = c.count;
  }catch(e){}
}

$("#go").onclick = () => { state.q = $("#q").value.trim(); state.cat = null; renderCats(); run(); };
$("#q").addEventListener("keydown", e => { if(e.key === "Enter") $("#go").click(); });
document.querySelectorAll(".hints b").forEach(el => el.onclick = () => {
  $("#q").value = el.dataset.q; $("#go").click();
});

const preset = new URLSearchParams(location.search).get("q");
if(preset){ $("#q").value = preset; state.q = preset; }

renderFilters(); renderCats(); stats();
loadMine().then(() => { renderMine(); run(); });
</script>
</body>
</html>
