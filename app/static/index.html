<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>free-for-dev 变更雷达</title>
<style>
  :root {
    --bg: #f7f7f5; --panel: #ffffff; --line: #e3e2dd;
    --text: #2c2c2a; --muted: #5f5e5a; --hint: #8a8880;
    --added: #1d9e75; --removed: #d85a30; --updated: #185fa5;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 32px 20px 60px; background: var(--bg); color: var(--text);
    font: 14px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
  }
  .wrap { max-width: 920px; margin: 0 auto; }
  header h1 { font-size: 20px; font-weight: 500; margin: 0 0 6px; }
  header p { color: var(--muted); margin: 0 0 24px; font-size: 13px; }
  .stats { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 24px; }
  .stat {
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    padding: 14px 18px; min-width: 130px;
  }
  .stat .k { color: var(--hint); font-size: 12px; }
  .stat .v { font-size: 22px; font-weight: 500; margin-top: 2px; }
  .filters { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
  .filters button {
    background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
    padding: 6px 14px; font-size: 13px; cursor: pointer; color: var(--muted);
    font-family: inherit;
  }
  .filters button[aria-pressed="true"] { border-color: var(--text); color: var(--text); }
  .card {
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    padding: 14px 18px; margin-bottom: 10px;
  }
  .card .top { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .tag {
    font-size: 11px; padding: 2px 8px; border-radius: 999px;
    border: 1px solid currentColor; flex: none;
  }
  .tag.added { color: var(--added); }
  .tag.removed { color: var(--removed); }
  .tag.updated { color: var(--updated); }
  .card .name { font-weight: 500; }
  .card .path { color: var(--hint); font-size: 12px; }
  .card .when { margin-left: auto; color: var(--hint); font-size: 12px; }
  .diff { margin-top: 10px; font-size: 13px; }
  .diff .row { display: flex; gap: 8px; padding: 3px 0; }
  .diff .mark { flex: none; width: 14px; color: var(--hint); }
  .diff .old { color: var(--removed); text-decoration: line-through; text-decoration-color: #f0b3a0; }
  .diff .new { color: var(--added); }
  .empty { color: var(--hint); padding: 40px 0; text-align: center; }
  a { color: var(--updated); }
  footer { margin-top: 32px; color: var(--hint); font-size: 12px; }
  footer code { background: #efeee9; padding: 1px 5px; border-radius: 4px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>free-for-dev 变更雷达</h1>
    <p>盯着 <a href="https://github.com/ripienaar/free-for-dev">ripienaar/free-for-dev</a> 的 README，把新增、下线、以及<strong>免费额度调整</strong>扒出来。</p>
  </header>

  <div class="stats" id="stats"></div>

  <div class="filters" id="filters">
    <button data-type="" aria-pressed="true">全部</button>
    <button data-type="added" aria-pressed="false">新增</button>
    <button data-type="removed" aria-pressed="false">下线</button>
    <button data-type="updated" aria-pressed="false">额度变更</button>
  </div>

  <div id="list"><div class="empty">加载中…</div></div>

  <footer>
    数据存在 SQLite 里，由 CronJob 定时调用 <code>python -m app.cli collect</code> 采集。
  </footer>
</div>

<script>
const LABEL = { added: "新增", removed: "下线", updated: "额度变更" };

async function loadStats() {
  const res = await fetch("/api/stats");
  const s = await res.json();
  const byType = s.changes_by_type || {};
  const cards = [
    ["当前收录条目", s.current_entries ?? 0],
    ["新增", byType.added || 0],
    ["下线", byType.removed || 0],
    ["额度变更", byType.updated || 0],
    ["最近采集", s.last_snapshot ? s.last_snapshot.fetched_at.replace("T", " ").replace("+00:00", " UTC") : "还没采集过"],
  ];
  document.getElementById("stats").innerHTML = cards
    .map(([k, v]) => `<div class="stat"><div class="k">${k}</div><div class="v">${v}</div></div>`)
    .join("");
}

function renderItems(items) {
  const list = document.getElementById("list");
  if (!items.length) {
    list.innerHTML = '<div class="empty">还没有变更记录。等下一次采集跑完就有数据了。</div>';
    return;
  }
  list.innerHTML = items.map((it) => {
    const path = [it.category, it.name].filter(Boolean).join(" · ");
    let diff = "";
    if (it.change_type === "updated") {
      diff = `<div class="diff">
        <div class="row"><span class="mark">−</span><span class="old">${escapeHtml(it.old_description || "(空)")}</span></div>
        <div class="row"><span class="mark">+</span><span class="new">${escapeHtml(it.new_description || "(空)")}</span></div>
      </div>`;
    } else if (it.change_type === "added") {
      diff = `<div class="diff"><div class="row"><span class="mark">+</span><span class="new">${escapeHtml(it.new_description || "(无描述)")}</span></div></div>`;
    } else {
      diff = `<div class="diff"><div class="row"><span class="mark">−</span><span class="old">${escapeHtml(it.old_description || "(无描述)")}</span></div></div>`;
    }
    const name = it.url
      ? `<a href="${escapeHtml(it.url)}" target="_blank" rel="noopener" class="name">${escapeHtml(it.name)}</a>`
      : `<span class="name">${escapeHtml(it.name)}</span>`;
    return `<div class="card">
      <div class="top">
        <span class="tag ${it.change_type}">${LABEL[it.change_type] || it.change_type}</span>
        ${name}
        <span class="path">${escapeHtml(path)}</span>
        <span class="when">${(it.detected_at || "").replace("T", " ").replace("+00:00", " UTC")}</span>
      </div>
      ${diff}
    </div>`;
  }).join("");
}

function escapeHtml(value) {
  return String(value).replace(/[&<>"']/g, (c) => (
    { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]
  ));
}

let activeType = "";
async function loadChanges() {
  const url = activeType ? `/api/changes?limit=200&change_type=${activeType}` : "/api/changes?limit=200";
  const res = await fetch(url);
  const data = await res.json();
  renderItems(data.items || []);
}

document.getElementById("filters").addEventListener("click", (event) => {
  const button = event.target.closest("button");
  if (!button) return;
  activeType = button.dataset.type;
  document.querySelectorAll("#filters button").forEach((b) => {
    b.setAttribute("aria-pressed", String(b === button));
  });
  loadChanges();
});

loadStats();
loadChanges();
</script>
</body>
</html>
