---
# 用 kustomize（kubectl 内置）统一改镜像地址和 tag，
# 避免把 tag 硬编码进 deployment.yaml。
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - cronjob.yaml

images:
  - name: ghcr.io/owner/free-for-dev-radar
    newName: ghcr.io/owner/free-for-dev-radar
    newTag: latest
