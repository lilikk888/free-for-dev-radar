---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: radar
  namespace: radar
  labels:
    app.kubernetes.io/name: radar
  spec:
    # 两个副本：数据在 PostgreSQL 里，多副本共享同一份数据，HPA 才有意义
    replicas: 2
    # 存储换成 PG 之后就不再抢 RWO 卷了，可以用滚动更新（原来必须 Recreate）
    strategy:
      type: RollingUpdate
      rollingUpdate:
        maxSurge: 1
        maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: radar
  template:
    metadata:
      labels:
        app.kubernetes.io/name: radar
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: radar
          image: ghcr.io/lilikk888/free-for-dev-radar:sha-29e0acf
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
            env:
              - name: RADAR_DB_PATH
                value: /data/radar.db
            # 配了 RADAR_DB_URL 就用 PostgreSQL（多副本的前提）；
            # 没配这个 Secret 时 optional 生效 → 回退到 SQLite，不影响启动。
            envFrom:
              - secretRef:
                  name: radar-pg
                  optional: true
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
