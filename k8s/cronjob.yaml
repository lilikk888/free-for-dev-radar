---
# 每 6 小时抓一次上游。Web 进程和采集进程共用同一个 SQLite 文件。
apiVersion: batch/v1
kind: CronJob
metadata:
  name: radar-collect
  namespace: radar
spec:
  schedule: "17 */6 * * *"
  timeZone: Asia/Shanghai
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app.kubernetes.io/name: radar-collect
        spec:
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
          containers:
            - name: collect
              image: ghcr.io/owner/free-for-dev-radar:latest
              imagePullPolicy: Always
              command: ["python", "-m", "app.cli", "collect"]
              env:
                - name: RADAR_DB_PATH
                  value: /data/radar.db
              volumeMounts:
                - name: data
                  mountPath: /data
              resources:
                requests:
                  cpu: 20m
                  memory: 64Mi
                limits:
                  cpu: 300m
                  memory: 192Mi
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: radar-data
