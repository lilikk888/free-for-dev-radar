---
# 每 6 小时抓一次上游。Web 进程和采集进程共用同一个 SQLite 文件。
apiVersion: batch/v1
kind: CronJob
metadata:
  name: radar-collect
  namespace: radar
spec:
  schedule: "17 */6 * * *"
  timeZone: Asia/Shanghai
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app.kubernetes.io/name: radar-collect
        spec:
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
          containers:
            - name: collect
              image: ghcr.io/lilikk888/free-for-dev-radar:sha-93f241e
              imagePullPolicy: Always
              command: ["python", "-m", "app.cli", "collect"]
              env:
                - name: RADAR_DB_PATH
                  value: /data/radar.db
                # 采集是跑几秒就退出的短命进程，Prometheus 根本抓不到它，
                # 所以把本次结果「推」到 Pushgateway 中转。
                # 没装 Pushgateway 也不影响采集：推送失败会被吞掉（见 app/metrics.py）。
                - name: RADAR_PUSHGATEWAY_URL
                  value: http://pushgateway.monitoring.svc.cluster.local:9091
              volumeMounts:
                - name: data
                  mountPath: /data
              resources:
                requests:
                  cpu: 20m
                  memory: 64Mi
                limits:
                  cpu: 300m
                  memory: 192Mi
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: radar-data
