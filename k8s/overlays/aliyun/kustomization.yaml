---
# 阿里云（1.6GB 小机器）专用 overlay。
#
# 为什么需要 overlay 而不是直接改基础清单：
#   **同一套 GitOps 清单分发到多个集群时，各集群的机器能力往往不同。**
#   东京那台 ARM 主控有 12GB，阿里云这台只有 1.6GB ——
#   硬套同一份配置（2 副本 + HPA 最多扩到 5）的后果是：
#     CPU 一高 → HPA 扩容 → 更吃内存/CPU → 负载更高 → 继续扩容
#   这条正反馈链路就是上次把那台机器拖到 sshd 都起不来的直接原因。
#
# 所以这里只做两件事：**降副本、压住 HPA 上限**。
# 业务逻辑完全不变（来自 base），只改「这台机器扛得住多少」。
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../../k8s

patches:
  - path: deployment-replicas.yaml
  - path: hpa-limits.yaml
