---
# kube-prometheus-stack（Prometheus + Grafana + Alertmanager + node-exporter + kube-state-metrics）
# 面向单节点 2 OCPU / 12 GB kubeadm 集群调过资源。
#
# 安装：
#   helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
#   helm repo update
#   helm install monitoring prometheus-community/kube-prometheus-stack \
#     --namespace monitoring --create-namespace \
#     --version 91.4.1 \
#     -f observability/values/kube-prometheus-stack.yaml

# 给所有对象打统一标签，方便 kubectl -l stack=monitoring 批量筛选
commonLabels:
  stack: monitoring

# 装 CRD（ServiceMonitor / PodMonitor / PrometheusRule 等）
crds:
  enabled: true

# ---------- Grafana ----------
grafana:
  # ⚠️ 关键：只能挂 /grafana 子路径。
  # 因为 radar 的 Ingress 已经占了 catch-all 的 "/"，同集群再加一个 "/" 会互相抢路由。
  ingress:
    enabled: true
    ingressClassName: nginx
    path: /grafana
    annotations:
      nginx.ingress.kubernetes.io/proxy-body-size: 8m

  # 子路径访问必须开 serve_from_sub_path，否则静态资源 404
  grafana.ini:
    server:
      root_url: "%(protocol)s://%(domain)s/grafana/"
      serve_from_sub_path: true
    # 原生中文界面。不开这个的话，用户容易用浏览器翻译，而浏览器翻译会直接改 DOM，
    # 把 Grafana 首页（React + SVG）搞崩：
    #   NotFoundError: Failed to execute 'insertBefore' on 'Node'
    # 注意 Grafana 官方汉化并不完整，只覆盖部分界面。
    users:
      default_language: zh-Hans

  # ⚠️ 开了 serve_from_sub_path 之后，Grafana 会把所有端点都挂到 /grafana 下，
  # 连 /metrics 也变成 /grafana/metrics（直接请求 /metrics 会 301 跳转）。
  # 不改这里的话，Prometheus 的 monitoring-grafana 这个 target 永远 DOWN。
  # （chart 自带注释就提示了这一点：Path … Might be different if server.root_url is set in grafana.ini）
  serviceMonitor:
    path: /grafana/metrics

  persistence:
    enabled: true
    type: sts
    storageClassName: local-path
    accessModes:
      - ReadWriteOnce
    size: 2Gi

  # 自带 30+ 个社区仪表盘（k8s 集群总览、节点、Pod、网络等）
  sidecar:
    dashboards:
      enabled: true
    datasources:
      enabled: true

  resources:
    requests:
      cpu: 20m
      memory: 128Mi
    limits:
      memory: 640Mi

# ---------- Prometheus ----------
prometheus:
  prometheusSpec:
    retention: 15d

    # 发现所有 namespace 的 ServiceMonitor / PodMonitor / PrometheusRule，
    # 否则后面的 Loki、自定义 exporter 不会被自动抓取
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    probeSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false

    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: local-path
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 8Gi

    resources:
      requests:
        cpu: 50m
        memory: 400Mi
      limits:
        memory: 1600Mi

# ---------- Alertmanager ----------
alertmanager:
  # ------------------------------------------------------------------
  # Alertmanager 配置
  #
  # 设计原则：**告警要少而准，否则会被无视**。
  #   - 只有 severity=critical 才真正打扰人
  #   - warning 只记进 Alertmanager，不推送（需要时自己去查）
  #   - 用 inhibition 把「一个根因引发的几十条派生告警」压成一条
  #
  # ⚠️ 下面带 REPLACE_ME 的 SMTP 是占位值，填上真实凭据后告警才会真正发邮件。
  #    在填之前：路由规则是生效的（可以用 API 验证），只是发信会失败。
  # ------------------------------------------------------------------
  config:
    global:
      resolve_timeout: 5m

      # ------------------------------------------------------------------
      # 邮件通知（以 163 邮箱为例）
      #
      # ⚠️ 这个文件在公开仓库里，**绝不能写真实凭据**。
      #    真实值放在同目录的 kube-prometheus-stack.local.yaml（已被 .gitignore 忽略），
      #    安装时两个文件一起传：
      #      helm upgrade monitoring prometheus-community/kube-prometheus-stack \
      #        -n monitoring --version 91.4.1 \
      #        -f observability/values/kube-prometheus-stack.yaml \
      #        -f observability/values/kube-prometheus-stack.local.yaml
      #
      # 163 的 SMTP 参数和 QQ 有两处不同，容易踩：
      #   1. 必须 smtp_require_tls: false —— 465 端口本身就是隐式 TLS，
      #      再要求 STARTTLS 会握手失败
      #   2. 建议 smtp_hello: "163.com" —— 部分反垃圾网关会校验 HELO 域
      #
      # 163 SMTP 端口实测（从东京这台机器）：
      #   465/994/587 通，25 不通（OCI 默认封禁出站 25，正常现象）
      # ------------------------------------------------------------------
      smtp_smarthost: "smtp.163.com:465"
      smtp_from: "REPLACE_ME@163.com"
      smtp_auth_username: "REPLACE_ME@163.com"
      # 邮箱后台生成的「授权码」，不是登录密码
      smtp_auth_password: "REPLACE_ME"
      smtp_require_tls: false
      smtp_hello: "163.com"

    route:
      # 默认什么都不发 —— 没配 severity 的告警（比如 chart 自带的）
      # 全部走 null，避免污染收件箱
      receiver: "null"
      group_by: ["alertname", "namespace"]
      group_wait: 30s          # 攒 30 秒再发，让同一批告警合并成一条
      group_interval: 5m       # 同一组的后续变化最多 5 分钟一次
      repeat_interval: 4h      # 没解决的告警最多 4 小时提醒一次

      routes:
        # critical：立刻通知（group_wait 缩短，2 小时提醒一次）
        - matchers:
            - severity = "critical"
          receiver: "email-critical"
          group_wait: 10s
          repeat_interval: 2h

        # warning：只记录不打扰
        - matchers:
            - severity = "warning"
          receiver: "null"
          repeat_interval: 12h

    inhibit_rules:
      # 1) critical 抑制同名 warning —— 同一个问题不要报两个级别
      - source_matchers:
          - severity = "critical"
        target_matchers:
          - severity = "warning"
        equal: ["alertname", "namespace"]

      # 2) 目标抓不到了，就别再报这个目标的业务告警
      #    （数据都没了，报「条目数骤降」纯属噪音）
      - source_matchers:
          - alertname = "RadarTargetDown"
        target_matchers:
          - alertname =~ "Radar(EntriesDropped|HttpErrorRate|CollectSlow)"
        equal: ["namespace"]

      # 3) 节点不可用时，抑制该节点上派生出来的一堆告警
      #    （一个节点挂了能炸出几十条，这是最常见的告警风暴场景）
      - source_matchers:
          - alertname =~ "NodeNotReady|KubeNodeNotReady"
        target_matchers:
          - alertname =~ "Kube.*|Radar.*"
        equal: ["node"]

    receivers:
      # 只记录，不发送任何东西。Alertmanager UI/API 里仍然能看到它
      - name: "null"

      # 真正会发信的 receiver
      - name: "email-critical"
        email_configs:
          - to: "REPLACE_ME@163.com"
            send_resolved: true          # 恢复了也发一封，不然不知道什么时候好的
            headers:
              Subject: '[CRITICAL] {{ .GroupLabels.alertname }} ({{ .Alerts.Firing | len }} firing)'

  alertmanagerSpec:
    # ⚠️ 这一行是必须的，踩过一次：
    # chart 的 `alertmanager.config` 会渲染进 secret
    # `alertmanager-<fullname>`，但**渲染出的 Alertmanager CR 里不带 configSecret 字段**，
    # 于是 prometheus-operator 用它自己生成的 `-generated` 默认配置，
    # 我们在 values 里写的路由/抑制规则被**彻底忽略**（而且不报任何错）。
    # 现象：改完配置 upgrade 成功、pod 重启了，但 /api/v2/status 里的 config 还是默认那套。
    configSecret: alertmanager-monitoring-kube-prometheus-alertmanager

    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: local-path
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 1Gi
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        memory: 320Mi

# ---------- Operator 与各 exporter（按单节点压到最小） ----------
prometheusOperator:
  resources:
    requests:
      cpu: 20m
      memory: 128Mi
    limits:
      memory: 512Mi
  admissionWebhooks:
    patch:
      resources:
        requests:
          cpu: 5m
          memory: 32Mi
        limits:
          memory: 128Mi

# ⚠️ 键名极易踩坑：kube-prometheus-stack 里同一组件有两套键
#     kubeStateMetrics         -> 只有 enabled 这类开关
#     kube-state-metrics       -> 子 chart 的真实配置（resources / probe …）
#     nodeExporter             -> 只有 enabled
#     prometheus-node-exporter -> 子 chart 的真实配置
# 写到错的键上 Helm **不会报错**，会静默忽略 —— 第一版就把 resources 写在了
# kubeStateMetrics 下，结果 Pod 的 resources 是空的，kube-state-metrics 因
# /livez 超时(503)被探针反复杀掉。
kubeStateMetrics:
  enabled: true

kube-state-metrics:
  resources:
    requests:
      cpu: 20m
      memory: 96Mi
    limits:
      memory: 320Mi
  # 单节点 2 OCPU 且同时启动一堆组件时，ksm 同步缓存会慢，
  # 默认探针（5s 超时 / 连失 3 次）容易误杀。放宽到 10s / 6 次。
  livenessProbe:
    httpGet:
      path: /livez
      port: http
    initialDelaySeconds: 20
    periodSeconds: 15
    timeoutSeconds: 10
    failureThreshold: 6
  readinessProbe:
    httpGet:
      path: /readyz
      port: metrics
    initialDelaySeconds: 20
    periodSeconds: 15
    timeoutSeconds: 10
    failureThreshold: 6

prometheus-node-exporter:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 160Mi
