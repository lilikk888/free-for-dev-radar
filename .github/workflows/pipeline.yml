---
name: pipeline

# 一条流水线走完：测试 -> 多架构构建推 GHCR -> 滚动更新到 k3s
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  test:
    name: 单元测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: pytest -v

  build:
    name: 构建多架构镜像
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # 集群里同时有 arm64（OCI ARM）和 amd64（OCI Micro / 阿里云），
      # 所以镜像必须一次构建出两种架构。
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=sha,format=short
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 打印镜像地址
        run: echo "已推送：${{ steps.meta.outputs.tags }}"

  deploy:
    name: 部署到 Kubernetes
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    concurrency:
      group: deploy-radar
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: 检查部署密钥已配置
        env:
          K3S_HOST: ${{ secrets.K3S_HOST }}
          K3S_USER: ${{ secrets.K3S_USER }}
          K3S_SSH_KEY: ${{ secrets.K3S_SSH_KEY }}
        run: |
          missing=""
          if [ -z "$K3S_HOST" ]; then missing="$missing K3S_HOST"; fi
          if [ -z "$K3S_USER" ]; then missing="$missing K3S_USER"; fi
          if [ -z "$K3S_SSH_KEY" ]; then missing="$missing K3S_SSH_KEY"; fi
          if [ -n "$missing" ]; then
            echo "::error::缺少仓库密钥:$missing 。请在 Settings -> Secrets and variables -> Actions 中添加后重新运行。"
            exit 1
          fi
          echo "部署密钥检查通过"

      - name: 配置 SSH 密钥
        env:
          K3S_HOST: ${{ secrets.K3S_HOST }}
          K3S_SSH_KEY: ${{ secrets.K3S_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$K3S_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$K3S_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: 渲染清单并 apply
        env:
          K3S_HOST: ${{ secrets.K3S_HOST }}
          K3S_USER: ${{ secrets.K3S_USER }}
        run: |
          TAG="sha-$(echo "$GITHUB_SHA" | cut -c1-7)"
          echo "部署 tag：$TAG"
          sed -i "s|ghcr.io/owner/free-for-dev-radar|${{ env.IMAGE }}|g" \
            k8s/kustomization.yaml k8s/deployment.yaml k8s/cronjob.yaml
          sed -i "s|newTag:.*|newTag: $TAG|" k8s/kustomization.yaml
          kubectl kustomize k8s/ | ssh -i ~/.ssh/id_ed25519 \
            "$K3S_USER@$K3S_HOST" \
            "kubectl apply -f -"

      - name: 等待滚动更新结束
        env:
          K3S_HOST: ${{ secrets.K3S_HOST }}
          K3S_USER: ${{ secrets.K3S_USER }}
        run: |
          ssh -i ~/.ssh/id_ed25519 \
            "$K3S_USER@$K3S_HOST" \
            "kubectl -n radar rollout status deployment/radar --timeout=180s"

      - name: 冒烟测试
        env:
          K3S_HOST: ${{ secrets.K3S_HOST }}
          K3S_USER: ${{ secrets.K3S_USER }}
        run: |
          sleep 5
          ssh -i ~/.ssh/id_ed25519 \
            "$K3S_USER@$K3S_HOST" \
            "curl -fsS -o /dev/null -w 'healthz -> %{http_code}\n' http://localhost/healthz"
