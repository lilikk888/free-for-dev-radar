---
name: pipeline

# 一条流水线走完：测试 -> 多架构构建推 GHCR -> 滚动更新到 k3s
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# ⭐ 并发控制：同一个分支只允许一条流水线在跑。
# 不加这个，两次快速推送会让两个 run 同时回写镜像 tag，
# 后一个 push 会被拒（`! [rejected] main -> main (fetch first)`）——
# 这个失败真实发生过（run 35750993767）。
concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  test:
    name: 单元测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: pytest -v

  build:
    name: 构建多架构镜像
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # 集群里同时有 arm64（OCI ARM）和 amd64（OCI Micro / 阿里云），
      # 所以镜像必须一次构建出两种架构。
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=sha,format=short
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 打印镜像地址
        run: echo "已推送：${{ steps.meta.outputs.tags }}"

  deploy:
    name: 提交镜像 tag 到 Git（Argo CD 自动同步）
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      # GitOps 模式：CI 不再直接改集群，而是把新镜像 tag 提交回仓库。
      # 所以这里要写权限，但**不再需要集群的写权限**。
      contents: write
      packages: read
    concurrency:
      group: deploy-radar
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: 检查部署密钥已配置
        env:
          K3S_HOST: ${{ secrets.K3S_HOST }}
          K3S_USER: ${{ secrets.K3S_USER }}
          K3S_SSH_KEY: ${{ secrets.K3S_SSH_KEY }}
        run: |
          missing=""
          if [ -z "$K3S_HOST" ]; then missing="$missing K3S_HOST"; fi
          if [ -z "$K3S_USER" ]; then missing="$missing K3S_USER"; fi
          if [ -z "$K3S_SSH_KEY" ]; then missing="$missing K3S_SSH_KEY"; fi
          if [ -n "$missing" ]; then
            echo "::error::缺少仓库密钥:$missing 。请在 Settings -> Secrets and variables -> Actions 中添加后重新运行。"
            exit 1
          fi
          echo "部署密钥检查通过"

      - name: 配置 SSH 密钥
        env:
          K3S_HOST: ${{ secrets.K3S_HOST }}
          K3S_SSH_KEY: ${{ secrets.K3S_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$K3S_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$K3S_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: 检查集群 API 可达
        env:
          K3S_HOST: ${{ secrets.K3S_HOST }}
          K3S_USER: ${{ secrets.K3S_USER }}
        run: |
          # 前置探活，把「集群不可用」和「清单写错了」这两类失败区分开。
          # 没有这一步时，控制面不可达会吐 8 行 connection refused，
          # 看不出是集群在维护、节点宕机、还是自己的 YAML 有问题。
          if ssh -i ~/.ssh/id_ed25519 -o ConnectTimeout=10 -o BatchMode=yes \
               "$K3S_USER@$K3S_HOST" \
               "kubectl get --raw /readyz" > /tmp/readyz.out 2>&1; then
            echo "集群 API 可达: $(cat /tmp/readyz.out)"
          else
            echo "::error::集群 API 不可达（$K3S_HOST）"
            echo "::error::探活输出: $(cat /tmp/readyz.out)"
            echo "::error::常见原因：控制面正在维护（例如做 etcd 恢复演练 / 证书续期）、节点宕机、网络不通。"
            echo "::error::请先确认集群已恢复，再重跑本工作流 —— 不要盲目重试，那会掩盖真正的问题。"
            exit 1
          fi

      # ⭐ 在构建镜像之前先卡一道 YAML 校验。
      # 起因：脚本批量追加 envFrom 时产生重复键，PyYAML 不报错、
      # kustomize 报错 → Argo CD 卡在 Unknown，整条 GitOps 停摆。
      # 这类错误应该在 CI 就拦住，而不是等 Argo 报个「第 49 行」让人猜。
      - name: 校验 k8s 清单（含重复键检查）
        run: |
          pip install --quiet pyyaml
          python tools/validate-manifests.py

      - name: 回写镜像 tag 到仓库
        run: |
          TAG="sha-$(echo "$GITHUB_SHA" | cut -c1-7)"
          echo "新镜像 tag：$TAG"

          if grep -q "newTag: $TAG" k8s/kustomization.yaml; then
            echo "仓库里已经是 $TAG，无需提交"
            exit 0
          fi

          # kustomization 是权威来源；deployment/cronjob 里的字面量也一起改，
          # 这样即使有人直接 kubectl apply 单个文件也不会拿到旧镜像
          sed -i "s|newTag:.*|newTag: $TAG|" k8s/kustomization.yaml
          sed -i "s|\(ghcr.io/lilikk888/free-for-dev-radar:\)[^[:space:]]*|\1$TAG|g" \
            k8s/deployment.yaml k8s/cronjob.yaml

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add k8s/
          # ⚠️ [skip ci] 必须有：否则这次回写提交会再触发一轮流水线，形成无限循环
          git commit -m "chore(deploy): bump image to $TAG [skip ci]"
          # 推送重试：远端可能被别的东西推过（并发 run、人工提交）。
          # 先 fetch + rebase 再推，最多试 5 次 —— 回写 tag 这种事失败一次
          # 就意味着集群镜像不更新，不能只推一次听天由命。
          for i in 1 2 3 4 5; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort
              echo "rebase 冲突，跳过这次重试"
              sleep 5
              continue
            fi
            if git push; then
              echo "tag 已推送（第 $i 次尝试）"
              exit 0
            fi
            sleep 5
          done
          echo "::error::回写 tag 连续 5 次失败，请检查仓库权限或并发冲突"
          exit 1
          echo "已提交，Argo CD 会在下一轮 reconciliation 时同步"

      - name: 等待 Argo CD 同步并滚动更新完成
        env:
          K3S_HOST: ${{ secrets.K3S_HOST }}
          K3S_USER: ${{ secrets.K3S_USER }}
        run: |
          TAG="sha-$(echo "$GITHUB_SHA" | cut -c1-7)"
          LIVE=""
          # Argo CD 默认 3 分钟轮询一次；本项目把 timeout.reconciliation 调成了 60s。
          # 这里等最多 10 分钟，足够「轮询发现变化 + 滚动更新」走完
          for i in $(seq 1 40); do
            LIVE=$(ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes -o ConnectTimeout=10 \
                     "$K3S_USER@$K3S_HOST" \
                     "kubectl -n radar get deploy radar -o jsonpath='{.spec.template.spec.containers[0].image}'" \
                   2>/dev/null || true)
            echo "[$i/40] 集群当前镜像: ${LIVE:-<读取失败>}"
            case "$LIVE" in
              *"$TAG") echo "✅ Argo CD 已同步到 $TAG"; break ;;
            esac
            sleep 15
          done

          case "$LIVE" in
            *"$TAG") ;;
            *)
              echo "::error::超时：Argo CD 未在预期时间内同步到 $TAG"
              echo "::error::排查：kubectl -n argocd get application radar -o jsonpath='{.status.sync.status}'"
              echo "::error::      kubectl -n argocd get application radar -o jsonpath='{.status.conditions}'"
              exit 1
              ;;
          esac

          ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes \
            "$K3S_USER@$K3S_HOST" \
            "kubectl -n radar rollout status deployment/radar --timeout=180s"

      - name: 冒烟测试
        env:
          K3S_HOST: ${{ secrets.K3S_HOST }}
          K3S_USER: ${{ secrets.K3S_USER }}
        run: |
          sleep 5
          ssh -i ~/.ssh/id_ed25519 \
            "$K3S_USER@$K3S_HOST" \
            "curl -fsS -o /dev/null -w 'healthz -> %{http_code}\n' http://localhost/healthz"
